<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amimono Mermaid</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg-primary: #ffffff;
        --bg-secondary: #f5f4f0;
        --bg-tertiary: #eeede9;
        --text-primary: #1a1a1a;
        --text-secondary: #6b6b6b;
        --text-tertiary: #aaaaaa;
        --border-light: rgba(0, 0, 0, 0.12);
        --border-mid: rgba(0, 0, 0, 0.22);
        --radius-md: 8px;
        --radius-lg: 12px;
        --font-sans: system-ui, -apple-system, sans-serif;
        --font-mono: "Menlo", "Monaco", "Consolas", monospace;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg-primary: #1e1e1e;
          --bg-secondary: #2a2a2a;
          --bg-tertiary: #333333;
          --text-primary: #e8e8e8;
          --text-secondary: #999999;
          --text-tertiary: #555555;
          --border-light: rgba(255, 255, 255, 0.1);
          --border-mid: rgba(255, 255, 255, 0.2);
        }
      }

      body {
        font-family: var(--font-sans);
        background: var(--bg-secondary);
        color: var(--text-primary);
        min-height: 100vh;
      }

      header {
        background: var(--bg-primary);
        border-bottom: 0.5px solid var(--border-light);
        padding: 14px 24px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      header h1 {
        font-size: 16px;
        font-weight: 500;
        color: var(--text-primary);
      }

      header .subtitle {
        font-size: 13px;
        color: var(--text-secondary);
      }

      .main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px 16px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 16px;
        min-height: calc(100vh - 56px);
      }

      @media (max-width: 720px) {
        .main {
          grid-template-columns: 1fr;
        }
      }

      .panel {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .plabel {
        font-size: 12px;
        color: var(--text-secondary);
        font-weight: 500;
        letter-spacing: 0.04em;
      }

      .toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }

      .seg-wrap {
        display: flex;
        border: 0.5px solid var(--border-mid);
        border-radius: var(--radius-md);
        overflow: hidden;
      }

      .seg {
        font-size: 12px;
        padding: 5px 12px;
        background: var(--bg-primary);
        color: var(--text-secondary);
        cursor: pointer;
        border: none;
        font-family: var(--font-sans);
        transition: background 0.15s;
      }

      .seg:not(:last-child) {
        border-right: 0.5px solid var(--border-light);
      }

      .seg.active {
        background: var(--bg-tertiary);
        color: var(--text-primary);
        font-weight: 500;
      }

      .seg:hover:not(.active) {
        background: var(--bg-secondary);
      }

      textarea {
        flex: 1;
        font-family: var(--font-mono);
        font-size: 13px;
        padding: 12px;
        border: 0.5px solid var(--border-mid);
        border-radius: var(--radius-md);
        background: var(--bg-primary);
        color: var(--text-primary);
        resize: none;
        line-height: 2;
        min-height: 240px;
        outline: none;
        transition: border-color 0.15s;
      }

      textarea:focus {
        border-color: rgba(0, 0, 0, 0.4);
      }

      @media (prefers-color-scheme: dark) {
        textarea:focus {
          border-color: rgba(255, 255, 255, 0.35);
        }
      }

      .legend {
        background: var(--bg-primary);
        border: 0.5px solid var(--border-light);
        border-radius: var(--radius-md);
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .leg-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .li {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        color: var(--text-secondary);
      }

      .lsym {
        width: 22px;
        height: 22px;
        border: 0.5px solid var(--border-mid);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-family: var(--font-mono);
        background: var(--bg-secondary);
        border-radius: 4px;
        color: var(--text-primary);
        font-weight: 500;
      }

      .preview-panel {
        display: flex;
        flex-direction: column;
        gap: 10px;
        position: sticky;
        top: 20px;
      }

      .btn {
        font-size: 12px;
        padding: 5px 12px;
        border: 0.5px solid var(--border-mid);
        border-radius: var(--radius-md);
        background: var(--bg-primary);
        color: var(--text-primary);
        cursor: pointer;
        font-family: var(--font-sans);
        transition: background 0.15s;
      }

      .btn:hover {
        background: var(--bg-secondary);
      }
      .btn:active {
        transform: scale(0.97);
      }

      .preview-box {
        flex: 1;
        border: 0.5px solid var(--border-mid);
        border-radius: var(--radius-lg);
        background: var(--bg-primary);
        overflow: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 380px;
        padding: 20px;
      }

      #preview-svg svg {
        display: block;
      }

      .tip {
        font-size: 11px;
        color: var(--text-tertiary);
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>🧶 Amimono Mermaid</h1>
      <span class="subtitle"
        >テキストで記号を入力すると編み図が描画されます</span
      >
    </header>

    <main class="main">
      <div class="panel">
        <div class="toolbar">
          <span class="plabel">モード</span>
          <div class="seg-wrap">
            <button class="seg active" id="btn-flat" onclick="setMode('flat')">
              平編み
            </button>
            <button class="seg" id="btn-circ" onclick="setMode('circ')">
              円形編み
            </button>
          </div>
        </div>

        <div class="toolbar">
          <span class="plabel">色付け</span>
          <div class="seg-wrap">
            <button class="seg active" id="btn-sym" onclick="setColor('sym')">
              目の種類
            </button>
            <button class="seg" id="btn-row" onclick="setColor('row')">
              段ごと
            </button>
          </div>
        </div>

        <div class="toolbar">
          <span class="plabel">テキスト</span>
          <button class="btn" onclick="exportTxt()">テキスト保存</button>
        </div>

        <textarea id="inp-flat" spellcheck="false">
# 平編みサンプル（# から始まる行はコメント）
. . . . . . . . . .
x x x x x x x x x x
x v x x x x v x x x
T T T T T T T T T T
x x ^ x x ^ x x x x
* x x x x x x x x *
x x x x x x x x x x
    </textarea
        >

        <textarea id="inp-circ" spellcheck="false" style="display: none">
# 円形編みサンプル（1行目が中心、下に行くほど外側）
. . . . . .
x x x x x x x x x x x x
x v x x v x x v x x v x
T T T T T T T T T T T T T T T T
x x x v x x x v x x x v x x x v
x x x x x x x x x x x x x x x x x x x x
    </textarea
        >

        <div class="legend">
          <span class="plabel">記号一覧（スペース区切りで入力）</span>
          <div class="leg-row">
            <div class="li">
              <div class="lsym">.</div>
              鎖目
            </div>
            <div class="li">
              <div class="lsym">x</div>
              細編み
            </div>
            <div class="li">
              <div class="lsym">T</div>
              長編み
            </div>
            <div class="li">
              <div class="lsym">t</div>
              中長編み
            </div>
            <div class="li">
              <div class="lsym">3</div>
              長々編み
            </div>
            <div class="li">
              <div class="lsym">v</div>
              増し目
            </div>
            <div class="li">
              <div class="lsym">^</div>
              減らし目
            </div>
            <div class="li">
              <div class="lsym">*</div>
              引き抜き編み
            </div>
            <div class="li">
              <div class="lsym">s</div>
              空白
            </div>
          </div>
          <p class="tip">
            記号をスペースまたはタブで区切って1段を1行に書いてください。スペース・タブは区切り文字として扱われ、図には含まれません。空白マスを置きたい場合は <code>s</code> を使ってください。#
            で始まる行はコメントとして無視されます。
          </p>
        </div>
      </div>

      <div class="preview-panel">
        <div class="toolbar">
          <span class="plabel">プレビュー</span>
          <button class="btn" onclick="doZoom(1)">＋</button>
          <button class="btn" onclick="doZoom(-1)">－</button>
          <button class="btn" onclick="exportSVG()">SVG保存</button>
        </div>
        <div class="preview-box">
          <div id="preview-svg"></div>
        </div>
      </div>
    </main>

    <script>
      let sc = 1.0,
        mode = "flat",
        colorMode = "sym";

      const SYM_COLORS = {
        ".": "#1D9E75",
        x: null,
        t: "#534AB7",
        T: "#534AB7",
        3: "#534AB7",
        v: "#0F6E56",
        "^": "#993C1D",
        "*": "#BA7517",
        s: null,
      };

      const ROW_PALETTE = [
        "#E24B4A",
        "#BA7517",
        "#639922",
        "#1D9E75",
        "#378ADD",
        "#534AB7",
        "#D4537E",
        "#D85A30",
        "#0F6E56",
        "#185FA5",
        "#3C3489",
        "#993556",
      ];

      function getPrimaryColor() {
        return window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "#e8e8e8"
          : "#1a1a1a";
      }

      function getBorderColor() {
        return window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "rgba(255,255,255,0.1)"
          : "rgba(0,0,0,0.1)";
      }

      function getCenterColor() {
        return window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "rgba(255,255,255,0.2)"
          : "rgba(0,0,0,0.18)";
      }

      function setMode(m) {
        mode = m;
        document.getElementById("inp-flat").style.display =
          m === "flat" ? "" : "none";
        document.getElementById("inp-circ").style.display =
          m === "circ" ? "" : "none";
        document
          .getElementById("btn-flat")
          .classList.toggle("active", m === "flat");
        document
          .getElementById("btn-circ")
          .classList.toggle("active", m === "circ");
        render();
      }

      function setColor(c) {
        colorMode = c;
        document
          .getElementById("btn-sym")
          .classList.toggle("active", c === "sym");
        document
          .getElementById("btn-row")
          .classList.toggle("active", c === "row");
        render();
      }

      function getStrokeColor(sym, rowIdx) {
        if (colorMode === "row")
          return ROW_PALETTE[rowIdx % ROW_PALETTE.length];
        const c = SYM_COLORS[sym];
        return c !== null && c !== undefined ? c : getPrimaryColor();
      }

      function parseRows(id) {
        return document
          .getElementById(id)
          .value.split("\n")
          .map((l) => l.trim())
          .filter((l) => l.length > 0 && !l.startsWith("#"))
          .map((l) => [...l].filter((c) => c !== " " && c !== "\t"));
      }

      function svgEl(tag, attrs) {
        const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
        return el;
      }

      function symDrawSVG(parent, sym, cx, cy, s, radAngle, color) {
        const deg = (radAngle * 180) / Math.PI;
        const g = svgEl("g", {
          transform: `translate(${cx},${cy}) rotate(${deg})`,
        });
        const sw = Math.max(1.2, s * 0.06);
        switch (sym) {
          case ".":
            g.appendChild(
              svgEl("ellipse", {
                cx: 0,
                cy: 0,
                rx: s * 0.36,
                ry: s * 0.21,
                stroke: color,
                fill: "none",
                "stroke-width": sw,
              }),
            );
            break;
          case "x":
            g.appendChild(
              svgEl("line", {
                x1: -s * 0.2,
                y1: -s * 0.2,
                x2: s * 0.2,
                y2: s * 0.2,
                stroke: color,
                "stroke-width": sw,
              }),
            );
            g.appendChild(
              svgEl("line", {
                x1: s * 0.2,
                y1: -s * 0.2,
                x2: -s * 0.2,
                y2: s * 0.2,
                stroke: color,
                "stroke-width": sw,
              }),
            );
            break;
          case "t":
            g.appendChild(
              svgEl("line", {
                x1: -s * 0.28,
                y1: -s * 0.35,
                x2: s * 0.28,
                y2: -s * 0.35,
                stroke: color,
                "stroke-width": sw,
              }),
            );
            g.appendChild(
              svgEl("line", {
                x1: 0,
                y1: -s * 0.35,
                x2: 0,
                y2: s * 0.44,
                stroke: color,
                "stroke-width": sw,
              }),
            );
            break;
          case "T":
            g.appendChild(
              svgEl("line", {
                x1: -s * 0.28,
                y1: -s * 0.35,
                x2: s * 0.28,
                y2: -s * 0.35,
                stroke: color,
                "stroke-width": sw,
              }),
            );
            g.appendChild(
              svgEl("line", {
                x1: -s * 0.14,
                y1: -s * 0.18,
                x2: s * 0.14,
                y2: -s * 0.02,
                stroke: color,
                "stroke-width": sw,
              }),
            );
            g.appendChild(
              svgEl("line", {
                x1: 0,
                y1: -s * 0.35,
                x2: 0,
                y2: s * 0.44,
                stroke: color,
                "stroke-width": sw,
              }),
            );
            break;
          case "3":
            g.appendChild(
              svgEl("line", {
                x1: -s * 0.28,
                y1: -s * 0.35,
                x2: s * 0.28,
                y2: -s * 0.35,
                stroke: color,
                "stroke-width": sw,
              }),
            );
            g.appendChild(
              svgEl("line", {
                x1: -s * 0.14,
                y1: -s * 0.26,
                x2: s * 0.14,
                y2: -s * 0.1,
                stroke: color,
                "stroke-width": sw,
              }),
            );
            g.appendChild(
              svgEl("line", {
                x1: -s * 0.14,
                y1: -s * 0.04,
                x2: s * 0.14,
                y2: s * 0.12,
                stroke: color,
                "stroke-width": sw,
              }),
            );
            g.appendChild(
              svgEl("line", {
                x1: 0,
                y1: -s * 0.35,
                x2: 0,
                y2: s * 0.44,
                stroke: color,
                "stroke-width": sw,
              }),
            );
            break;
          case "v":
            g.appendChild(
              svgEl("polyline", {
                points: `${-s * 0.28},${-s * 0.42} 0,${s * 0.42} ${s * 0.28},${-s * 0.42}`,
                stroke: color,
                fill: "none",
                "stroke-width": sw,
              }),
            );
            g.appendChild(
              svgEl("circle", {
                cx: 0,
                cy: -s * 0.08,
                r: s * 0.14,
                stroke: color,
                fill: "none",
                "stroke-width": sw,
              }),
            );
            break;
          case "^":
            g.appendChild(
              svgEl("polyline", {
                points: `${-s * 0.28},${s * 0.32} 0,${-s * 0.4} ${s * 0.28},${s * 0.32}`,
                stroke: color,
                fill: "none",
                "stroke-width": sw,
              }),
            );
            g.appendChild(
              svgEl("line", {
                x1: -s * 0.28,
                y1: s * 0.32,
                x2: s * 0.28,
                y2: s * 0.32,
                stroke: color,
                "stroke-width": sw,
              }),
            );
            break;
          case "*":
            g.appendChild(
              svgEl("circle", {
                cx: 0,
                cy: 0,
                r: s * 0.18,
                fill: color,
                stroke: "none",
              }),
            );
            break;
          case "s":
            break;
        }
        parent.appendChild(g);
      }

      function renderFlatSVG(rows, S) {
        const PAD = 20;
        const maxC = Math.max(...rows.map((r) => r.length));
        const W = maxC * S + PAD * 2,
          H = rows.length * S + PAD * 2;
        const svg = svgEl("svg", {
          xmlns: "http://www.w3.org/2000/svg",
          width: W,
          height: H,
          viewBox: `0 0 ${W} ${H}`,
        });
        const lc = getBorderColor();

        for (let r = 0; r < rows.length; r++) {
          for (let c = 0; c < rows[r].length; c++) {
            const cx = PAD + c * S + S / 2,
              cy = PAD + r * S + S / 2;
            const sym = rows[r][c];
            if (!sym) continue;
            const color = getStrokeColor(sym, r);
            if (c < rows[r].length - 1 && sym !== "s" && rows[r][c + 1] !== "s") {
              const nextCx = PAD + (c + 1) * S + S / 2;
              const lineColor =
                colorMode === "row"
                  ? ROW_PALETTE[r % ROW_PALETTE.length] + "55"
                  : lc;
              const lw = colorMode === "row" ? 0.8 : 0.5;
              svg.appendChild(
                svgEl("line", {
                  x1: cx + S * 0.42,
                  y1: cy,
                  x2: nextCx - S * 0.42,
                  y2: cy,
                  stroke: lineColor,
                  "stroke-width": lw,
                }),
              );
            }
            if (sym !== "s") symDrawSVG(svg, sym, cx, cy, S, 0, color);
          }
        }
        return svg;
      }

      function renderCircSVG(rows, S) {
        const INNER = S * 1.0,
          GAP = S * 1.05;
        const maxR = INNER + rows.length * GAP + S;
        const sz = (maxR + S) * 2;
        const OX = sz / 2,
          OY = sz / 2;
        const ringC = getBorderColor();
        const svg = svgEl("svg", {
          xmlns: "http://www.w3.org/2000/svg",
          width: sz,
          height: sz,
          viewBox: `0 0 ${sz} ${sz}`,
        });

        for (let ri = 0; ri < rows.length; ri++) {
          const row = rows[ri];
          const n = row.length;
          if (!n) continue;
          const radius = INNER + ri * GAP + GAP / 2;
          const rowColor = ROW_PALETTE[ri % ROW_PALETTE.length];
          const angleStep = (2 * Math.PI) / n;

          svg.appendChild(
            svgEl("circle", {
              cx: OX,
              cy: OY,
              r: radius,
              stroke: colorMode === "row" ? rowColor + "44" : ringC,
              fill: "none",
              "stroke-width": colorMode === "row" ? 0.8 : 0.6,
            }),
          );

          for (let ci = 0; ci < n; ci++) {
            const baseAngle = -Math.PI / 2 + angleStep * ci;
            const cx = OX + Math.cos(baseAngle) * radius;
            const cy = OY + Math.sin(baseAngle) * radius;
            const sym = row[ci];
            if (!sym) continue;

            if (ci < n - 1 && sym !== "s" && row[ci + 1] !== "s") {
              const nx =
                OX + Math.cos(-Math.PI / 2 + angleStep * (ci + 1)) * radius;
              const ny =
                OY + Math.sin(-Math.PI / 2 + angleStep * (ci + 1)) * radius;
              const dx = nx - cx,
                dy = ny - cy,
                dist = Math.sqrt(dx * dx + dy * dy);
              const shrink = S * 0.42;
              if (dist > shrink * 2) {
                const ux = dx / dist,
                  uy = dy / dist;
                svg.appendChild(
                  svgEl("line", {
                    x1: cx + ux * shrink,
                    y1: cy + uy * shrink,
                    x2: nx - ux * shrink,
                    y2: ny - uy * shrink,
                    stroke: colorMode === "row" ? rowColor + "55" : ringC,
                    "stroke-width": colorMode === "row" ? 0.8 : 0.5,
                  }),
                );
              }
            }

            const color = getStrokeColor(sym, ri);
            if (sym !== "s") symDrawSVG(svg, sym, cx, cy, S, baseAngle + Math.PI / 2, color);
          }
        }

        svg.appendChild(
          svgEl("circle", {
            cx: OX,
            cy: OY,
            r: S * 0.28,
            fill: getCenterColor(),
            stroke: "none",
          }),
        );

        return svg;
      }

      async function exportTxt() {
        const id = mode === "flat" ? "inp-flat" : "inp-circ";
        const text = document.getElementById(id).value;
        if (window.showSaveFilePicker) {
          try {
            const fileHandle = await window.showSaveFilePicker({
              suggestedName: "amimono.txt",
              types: [{ description: "テキストファイル", accept: { "text/plain": [".txt"] } }],
            });
            const writable = await fileHandle.createWritable();
            await writable.write(text);
            await writable.close();
          } catch (e) {
            if (e.name !== "AbortError") throw e;
          }
        } else {
          const input = prompt(
            "ファイル名を入力してください（.txt が付与されます）",
            "amimono",
          );
          if (input === null) return;
          const filename = (input.trim() || "amimono") + ".txt";
          const blob = new Blob([text], { type: "text/plain" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = filename;
          a.click();
          URL.revokeObjectURL(a.href);
        }
      }

      async function exportSVG() {
        const S = Math.round(24 * sc);
        const rows = parseRows(mode === "flat" ? "inp-flat" : "inp-circ");
        if (!rows.length) return;
        const svg =
          mode === "flat" ? renderFlatSVG(rows, S) : renderCircSVG(rows, S);
        const svgStr = new XMLSerializer().serializeToString(svg);
        if (window.showSaveFilePicker) {
          try {
            const fileHandle = await window.showSaveFilePicker({
              suggestedName: "amimono.svg",
              types: [{ description: "SVGファイル", accept: { "image/svg+xml": [".svg"] } }],
            });
            const writable = await fileHandle.createWritable();
            await writable.write(svgStr);
            await writable.close();
          } catch (e) {
            if (e.name !== "AbortError") throw e;
          }
        } else {
          const input = prompt(
            "ファイル名を入力してください（.svg が付与されます）",
            "amimono",
          );
          if (input === null) return;
          const filename = (input.trim() || "amimono") + ".svg";
          const blob = new Blob([svgStr], { type: "image/svg+xml" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = filename;
          a.click();
          URL.revokeObjectURL(a.href);
        }
      }

      function render() {
        const container = document.getElementById("preview-svg");
        const S = Math.round(24 * sc);
        const rows = parseRows(mode === "flat" ? "inp-flat" : "inp-circ");
        container.innerHTML = "";
        if (!rows.length) {
          container.textContent = "記号を入力してください";
          container.style.color = "#aaa";
          container.style.font = "13px sans-serif";
          return;
        }
        container.style.color = "";
        container.style.font = "";
        const svg = mode === "flat" ? renderFlatSVG(rows, S) : renderCircSVG(rows, S);
        container.appendChild(svg);
      }

      function doZoom(d) {
        sc = Math.max(0.4, Math.min(3, sc + d * 0.25));
        render();
      }

      document.getElementById("inp-flat").addEventListener("input", render);
      document.getElementById("inp-circ").addEventListener("input", render);
      window
        .matchMedia("(prefers-color-scheme: dark)")
        .addEventListener("change", render);
      render();
    </script>
  </body>
</html>
